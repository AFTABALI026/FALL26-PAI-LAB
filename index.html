<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>

<div class="weather-card text-center">
    <h2 class="mb-4 text-primary">🌦️ Live Weather App</h2>
    
    <form method="POST" class="mb-4">
        <div class="input-group">
            <input type="text" name="city" class="form-control" placeholder="City ka naam likhein..." required>
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    {% if weather %}
        <div class="card p-3 shadow-sm border-0 bg-light">
            <h3 class="font-weight-bold">{{ weather.city }}, {{ weather.country }}</h3>
            <img src="http://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="weather-icon" class="mx-auto" style="width: 100px;">
            <h1 class="display-4">{{ weather.temp }}°C</h1>
            <h5 class="text-secondary">{{ weather.description }}</h5>
            
            <div class="row mt-4 pt-3 border-top">
                <div class="col-6">
                    <strong>💧 Humidity</strong>
                    <p class="mb-0">{{ weather.humidity }}%</p>
                </div>
                <div class="col-6">
                    <strong>💨 Wind</strong>
                    <p class="mb-0">{{ weather.wind_speed }} m/s</p>
                </div>
            </div>
        </div>
    {% endif %}
</div>

</body>
</html>
