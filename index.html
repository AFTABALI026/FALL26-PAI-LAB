<!DOCTYPE html>
<html>
<head>
    <title>FAISS AI Chatbot</title>
    <style>
        body {
            background-color: #f4f6f7;
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .chat-layout {
            width: 480px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .message-logs {
            height: 380px;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
        .bubble {
            margin-bottom: 15px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            white-space: pre-line;
            font-size: 14px;
        }
        .client-side {
            background: #2980b9;
            color: white;
            margin-left: auto;
        }
        .assistant-side {
            background: #eaeded;
            color: #2c3e50;
        }
        .action-pane {
            padding: 12px;
            display: flex;
        }
        #textInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        #actionBtn {
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-layout">
    <div class="chat-header">🤖 FAISS AI Medical Query System</div>
    <div class="message-logs" id="logBox">
        <div class="bubble assistant-side">Hello! System initialization successful. Ask me anything related to Metro Medical Center info.</div>
    </div>
    <div class="action-pane">
        <input type="text" id="textInput" placeholder="Ask about doctor availability, timings, booking...">
        <button id="actionBtn" onclick="dispatchMessage()">Send</button>
    </div>
</div>

<script>
    document.getElementById("textInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") dispatchMessage();
    });

    function dispatchMessage() {
        var field = document.getElementById("textInput");
        var val = field.value.trim();
        if (val == "") return;

        var box = document.getElementById("logBox");
        
        // Append client UI logs
        var userNode = document.createElement("div");
        userNode.className = "bubble client-side";
        userNode.textContent = val;
        box.appendChild(userNode);
        
        field.value = "";
        box.scrollTop = box.scrollHeight;

        // Dynamic API request dispatching
        fetch('/get_response', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: val })
        })
        .then(res => res.json())
        .then(payload => {
            var botNode = document.createElement("div");
            botNode.className = "bubble assistant-side";
            botNode.textContent = payload.response;
            box.appendChild(botNode);
            box.scrollTop = box.scrollHeight;
        });
    }
</script>

</body>
</html>
